<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Vanadis Bord</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>Vanadis <span>Bord</span> <span class="toggle-btn" onclick="bord.toggleSidebar()">&#x25C0;</span></h1>
  </div>
  <div id="sessions-list"></div>
  <div id="new-session" onclick="bord.newSession()">+ New Session</div>
</div>

<div id="main">
  <div id="tabs">
    <span id="show-sidebar-btn" class="tab" style="display:none" onclick="bord.toggleSidebar()">&#x2630;</span>
    <div id="tab-list"></div>
    <div id="toolbar">
      <select id="model-select" onchange="bord.setModel(this.value)" title="Model">
        <option value="opus">Opus</option>
        <option value="sonnet" selected>Sonnet</option>
        <option value="haiku">Haiku</option>
      </select>
      <select id="theme-select" onchange="bord.setTheme(this.value)" title="Theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="blue">Blue</option>
        <option value="sand">Sand</option>
        <option value="dark-sand">Dark Sand</option>
      </select>
      <span class="toolbar-btn" onclick="bord.changeFontSize(-1)" title="Decrease font">A-</span>
      <span class="toolbar-btn" onclick="bord.changeFontSize(1)" title="Increase font">A+</span>
      <span class="toolbar-btn" id="bp-btn" onclick="bord.toggleBypass()" title="Bypass permissions">BP</span>
      <span class="toolbar-btn" onclick="bord.togglePanel()" title="Toggle tool panel">T</span>
    </div>
  </div>
  <div id="content">
    <div id="chat-area">
      <div id="messages">
        <div class="welcome-screen">
          <h2>Vanadis Bord</h2>
          <p>Select a session or create a new one</p>
        </div>
      </div>
      <div id="input-area">
        <textarea id="msg-input" placeholder="Type a message..." rows="3"
          onkeydown="bord.handleKey(event)" oninput="bord.autoResize(this)"></textarea>
        <button id="send-btn" onclick="bord.sendMessage()">Send</button>
      </div>
    </div>
    <div id="tool-panel">
      <div id="tool-panel-header">
        <span>Tool Activity</span>
        <span class="collapse-btn" onclick="bord.togglePanel()">&#x2715;</span>
      </div>
      <div id="tool-entries"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
