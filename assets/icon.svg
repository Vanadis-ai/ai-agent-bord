<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#f0a500"/>
      <stop offset="100%" stop-color="#d4880f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd70066"/>
      <stop offset="100%" stop-color="#f0a50033"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="vGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#ffd700" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Subtle circle ornament -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ring)" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring)" stroke-width="0.8"/>

  <!-- Subtle geometric lines -->
  <line x1="256" y1="66" x2="256" y2="120" stroke="#ffd70022" stroke-width="1"/>
  <line x1="256" y1="392" x2="256" y2="446" stroke="#ffd70022" stroke-width="1"/>
  <line x1="66" y1="256" x2="120" y2="256" stroke="#ffd70022" stroke-width="1"/>
  <line x1="392" y1="256" x2="446" y2="256" stroke="#ffd70022" stroke-width="1"/>

  <!-- Top glow -->
  <ellipse cx="256" cy="140" rx="100" ry="60" fill="url(#glow)"/>

  <!-- V letter -->
  <g filter="url(#vGlow)">
    <path d="M148 140 L256 390 L364 140 L330 140 L256 340 L182 140 Z"
          fill="url(#vGrad)" stroke="#ffd700" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Small decorative dots -->
  <circle cx="256" cy="420" r="3" fill="#ffd70088"/>
  <circle cx="236" cy="430" r="2" fill="#ffd70055"/>
  <circle cx="276" cy="430" r="2" fill="#ffd70055"/>
</svg>
